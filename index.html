<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Catalogue</title>

  <!-- Playfair Display (Heading) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Dancing Script (Quote) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
  <div class="container">
    <h1>Book Catalogue</h1>

    <p class="quote">
      “A book is a gift you can open again and again.” — Garrison Keillor
    </p>

    <form id="bookForm">
      <div class="input-row">
        <input type="text" id="title" placeholder="Title" required>
        <input type="text" id="author" placeholder="Author" required>
      </div>

      <button type="submit">Add Book</button>
    </form>

    <div id="bookList"></div>
  </div>

  <div class="external-links">
   <a href="https://archive.org/" target="_blank">Library</a>
   <a href="https://news.un.org/en/" target="_blank">News</a>
  </div>


  <script>
    const API = "https://book-catalogue-backend-mqii.onrender.com/api/books";
    const bookList = document.getElementById("bookList");
    const form = document.getElementById("bookForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const book = {
        title: title.value,
        author: author.value
      };

      await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(book)
      });

      form.reset();
      loadBooks();
    });

    async function loadBooks() {
      const res = await fetch(API);
      const books = await res.json();

      bookList.innerHTML = "";
       books.forEach(book => {
        bookList.innerHTML += `
          <div class="book">
           <strong>${book.title}</strong> — ${book.author}
           <button class="delete-btn" onclick="deleteBook('${book._id}')">
            Delete
           </button>
          </div>
          `;
      });
    }

    loadBooks();
    async function deleteBook(id) {
     await fetch(`${API}/${id}`, {
       method: "DELETE"
     });
     loadBooks();
    }

  </script>

</body>
</html>
